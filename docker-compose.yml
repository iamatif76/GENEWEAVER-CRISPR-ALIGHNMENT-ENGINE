services:
  backend:
    build: .
    container_name: geneweaver-backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - API_KEY=${API_KEY:-}
      - DATABASE_URL=sqlite:////app/data/geneweaver.db
      - UPLOAD_DIR=/app/uploads
      - GPU_ENABLED=auto
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: .
    container_name: geneweaver-frontend
    restart: unless-stopped
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_KEY=${API_KEY:-}
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads

